<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HostelEase – A comprehensive hostel management system for students, wardens, and security staff.">
  <title>HostelEase – Hostel Management System</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <!-- Favicon placeholder -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
</head>
<body>
  <!-- Toast notification container -->
  <div id="toast-container"></div>

  <!-- App root -->
  <div id="app">
    <!-- Loading splash -->
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:var(--bg-page)">
      <div style="width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 8px 24px rgba(99,102,241,.4)">🏨</div>
      <div style="text-align:center">
        <h1 style="font-size:2rem;font-weight:800;letter-spacing:-0.02em;color:var(--text-main);margin-bottom:.35rem">HostelEase</h1>
        <p style="color:var(--text-muted)">Loading your hostel management system…</p>
      </div>
      <div style="width:48px;height:4px;background:var(--border-medium);border-radius:2px;overflow:hidden">
        <div style="height:100%;background:var(--gradient-primary);border-radius:2px;animation:loadbar 1.2s ease-in-out infinite"></div>
      </div>
    </div>
  </div>

  <style>
    @keyframes loadbar {
      0%   { width:0;   transform:translateX(0); }
      50%  { width:100%;transform:translateX(0); }
      100% { width:0;   transform:translateX(200px); }
    }
  </style>

  <!-- JS – Order matters -->
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/security.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/student.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
